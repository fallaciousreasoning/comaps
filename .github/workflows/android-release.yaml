name: Android Release
on:
  workflow_dispatch: # Manual trigger
    inputs:
      draft:
        description: Create a draft release instead of publishing it
        type: boolean
        default: false

# Fingerprint of the key in the RELEASE_KEYSTORE secret. Not sensitive: it's in every signed APK.
env:
  CERT_SHA256: 3d188794de80374d6805114829e55e2485615d4ccb03674a23914f067caf2d52
  SKIP_MAP_DOWNLOAD: true

permissions:
  contents: write # To create the release

concurrency:
  group: ${{ github.workflow }}

jobs:
  android-release:
    name: Build and release arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build \
          qt6-base-dev \
          qt6-declarative-dev \
          qt6-positioning-dev \
          libqt6svg6-dev \
          optipng \
          libfreetype-dev \
          libharfbuzz-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          python3-pip \
          python3-venv \
          zlib1g-dev
          pip install "protobuf<3.21" --break-system-packages

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 200 # enough to get all commits for the current day

      # Relative submodule URLs would otherwise resolve to repositories this fork doesn't have.
      - name: Parallel submodules checkout
        shell: bash
        run: |
          git config --global url."https://codeberg.org/comaps/".insteadOf "https://github.com/${GITHUB_REPOSITORY_OWNER}/"
          git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Configure repository
        shell: bash
        run: ./configure.sh

      - name: Restore signing key
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          SECURE_PROPERTIES: ${{ secrets.SECURE_PROPERTIES }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > android/app/comaps-release.keystore
          echo "$SECURE_PROPERTIES" | base64 -d > android/app/secure.properties.release

      - name: Compile
        shell: bash
        working-directory: android
        run: ./gradlew -Parm64 assembleFdroidRelease

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f android/app/comaps-release.keystore android/app/secure.properties.release

      # Gradle silently falls back to the public debug key if the signing files are missing.
      - name: Check APK signature
        shell: bash
        run: |
          apk=$(ls android/app/build/outputs/apk/fdroid/release/CoMaps-*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "SHA-256 digest: $CERT_SHA256" certs.txt
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$APK" $DRAFT --target "$GITHUB_SHA" --title "CoMaps LINZ topo $tag" \
            --notes "Fdroid flavor arm64 APK built from ${GITHUB_SHA}."
